<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table {
            width: 80%;
            border-collapse: collapse;
            margin: auto;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: brown;
            color: white;
        }

        td {
            background-color: #f5f5f5;
        }
    </style>
</head>
<body>

    <table border="1">
    <tr>
        <th><h3>Product</h3></th>
        <th><h3>Price</h3></th>
        <th><h3>Quantity</h3></th>
        <th><h3>In Stock</h3></th>
        <th><h3>Thumbnail</h3></th>
        
    </tr>

    <tr>
        <td>Cake</td>
        <td>$10</td>
        <td>5</td>
        <td>YES</td>
        <td><img src="cake.png" width="50"></td>
    </tr>

    <tr>
        <td>Croissant</td>
        <td>$5</td>
        <td>8</td>
        <td>YES</td>
        <td><img src="croissant.png" width="50"></td>
    </tr>

    <tr>
        <td>Toast</td>
        <td>$4</td>
        <td>6</td>
        <td>NO</td>
        <td><img src="toast.png" width="50"></td>
    </tr>
</table>
</body>
</html>
